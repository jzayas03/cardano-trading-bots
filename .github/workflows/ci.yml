# CI for cardano-trading-bots.
# Runs shellcheck, lint, unit tests, and the Postgres-backed tests against a real postgres:16
# service, on every pull request to main and every push to main.
# Note: the pg tests use RUN_PG_TESTS=1 and DATABASE_URL; without them they are skipped, so
# both steps are needed for the suite to count as run.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, unit, postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ctb
          POSTGRES_PASSWORD: ctb_ci_only
          POSTGRES_DB: ctb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ctb -d ctb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Matches docker-compose.yml's host port so the same DATABASE_URL works locally and here.
      DATABASE_URL: postgres://ctb:ctb_ci_only@localhost:5433/ctb

    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts (shellcheck)
        # Before `npm ci` on purpose: a broken script then fails in seconds instead of two minutes
        # in. shellcheck ships on ubuntu-latest, so there is nothing to install.
        #
        # Scope is this repo's own shell. infra/vps/*.sh runs as root and rotates the database
        # password, and until now it was the only code here that nothing checked. `.specify/` is
        # excluded deliberately: it is vendored GitHub Spec Kit, regenerated upstream, and gating on
        # findings we do not own buys drift rather than safety.
        #
        # An EMPTY match FAILS. Bare `shellcheck` with no arguments reads stdin, so a rename that
        # moved these scripts out of the glob would otherwise turn this gate green by checking
        # nothing at all -- the same failure shape as an empty service list reading as healthy.
        run: |
          files="$(git ls-files 'infra/**/*.sh' 'scripts/*.sh')"
          if [ -z "$files" ]; then
            echo "::error::shellcheck matched no files; the glob in ci.yml is stale"
            exit 1
          fi
          echo "$files"
          echo "$files" | xargs shellcheck

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Postgres-backed tests
        run: npm run test:pg

      - name: Dependency audit (report only)
        # Known: two high advisories in axios <1 pinned by @indigo-labs/dexter with no upstream fix.
        # Visible on every run; becomes a blocking gate before any transaction-signing work.
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported vulnerabilities (see log); non-blocking by decision 2026-09-06"
